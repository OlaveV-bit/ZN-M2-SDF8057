#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/zn-m2.yml
# Description: Build OpenWrt ZN-M2 firmware (OpenClash + MosDNS) using GitHub Actions
#
name: zn-m2 build
on:
  schedule:
    - cron: '23 19 * * *'   # 每天北京时间 03:23 运行
  workflow_dispatch:
defaults:
  run:
    shell: bash -euo pipefail {0}
permissions:
  contents: write
  actions: write
env:
  REPO_URL: https://github.com/openwrt-fork/sdf8057-ipq6000.git
  REPO_BRANCH: master
  CONFIG_FILE: ./config/zn-m2.config
  DIY_P1_SH: ./scripts/zn-m2/diy-part1.sh
  DIY_P2_SH: ./scripts/zn-m2/diy-part2.sh
  DIY_P3_SH: ./scripts/zn-m2/diy-part3.sh
  TZ: Asia/Shanghai
jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
    - uses: actions/checkout@v4
    - name: Check OpenClash upstream release
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SHOULD_BUILD=false
        LATEST_OC=$(gh release list -R vernesong/OpenClash -L 1 --json tagName -q '.[0].tagName' || echo "")
        LATEST_TAG=$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName -q '.[0].tagName' || echo "")
        
        if [ -n "$LATEST_OC" ] && [ "${LATEST_OC//-r/-}" != "${LATEST_TAG//-r/-}" ]; then
          echo "OpenClash new release detected: ${LATEST_TAG:-none} -> $LATEST_OC"
          SHOULD_BUILD=true
        else
          echo "OpenClash release unchanged ($LATEST_TAG)"
        fi
        echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.check.outputs.should_build == 'true')
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. 深度清理服务器自带的无用大型软件，腾出约 30GB+ 空间防止爆盘
    - name: Maximize build disk space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 4096
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    # 2. 额外执行一次系统级清理
    - name: Additional disk cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
        sudo apt-get clean
        df -h

    # 3. 内嵌编译环境初始化
    - name: Setup build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        curl -s https://raw.githubusercontent.com/immortalwrt/build-scripts/master/init_build_environment.sh | sudo bash
        sudo apt-get install -y rename pigz libfuse-dev upx subversion clang lua5.1 liblua5.1-0-dev
        sudo apt-get autoremove -y --purge
        sudo apt-get clean
        sudo timedatectl set-timezone "$TZ"
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global user.name "$GITHUB_ACTOR"
        git config --global init.defaultBranch master
        sudo mkdir -p /workdir
        sudo chown "$USER:$(id -gn)" /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 4. 缓存编译下载包 (dl目录)
    - name: Restore dl cache
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-znm2-${{ hashFiles('config/zn-m2.config') }}
        restore-keys: |
          openwrt-dl-znm2-

    - name: Restore ccache cache
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: openwrt-ccache-znm2-${{ github.run_id }}
        restore-keys: |
          openwrt-ccache-znm2-

    # 5. 加载自定义信息源并自动剔除 telephony 源以防报错
    - name: Load custom feeds
      run: |
        if [ -f "feeds.conf.default" ]; then
          cp -f feeds.conf.default openwrt/feeds.conf.default || true
        fi
        if [ -f openwrt/feeds.conf.default ]; then
          sed -i '/telephony/d' openwrt/feeds.conf.default
        fi
        cd openwrt
        [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ] && bash "$GITHUB_WORKSPACE/$DIY_P1_SH" || true

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Modify feeds
      run: |
        cd openwrt
        [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ] && bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
        cd openwrt
        [ -f "$GITHUB_WORKSPACE/$DIY_P3_SH" ] && bash "$GITHUB_WORKSPACE/$DIY_P3_SH"

    - name: Download packages (with retry)
      run: |
        cd openwrt
        make defconfig
        export DOWNLOAD_ARGS="--retry-connrefused --waitretry=10 --max-retries=5"
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware (without gecoosac)
      run: |
        cd openwrt
        sed -i '/gecoosac/d' .config
        make defconfig
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    # 6. 内嵌固件整理与 SHA256 校验码自动生成
    - name: Organize firmware files
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        mkdir -p /tmp/release-firmware
        cp -a ./* /tmp/release-firmware/
        cd /tmp/release-firmware
        sha256sum * > sha256sums.txt
        echo "Release firmware files & checksums:"
        ls -la /tmp/release-firmware/

    # 7. 内嵌 Release 元数据生成
    - name: Generate release info
      id: tag
      run: |
        MANIFEST=$(ls openwrt/bin/targets/*/*/*.manifest 2>/dev/null | head -1 || echo "")
        OPENCLASH_VER=""
        if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
          OPENCLASH_VER=$(grep -m1 "luci-app-openclash" "$MANIFEST" | awk -F' - ' '{print $2}' || true)
        fi
        
        if [ -z "$OPENCLASH_VER" ]; then
          OPENCLASH_VER="build-${GITHUB_RUN_NUMBER}"
        fi

        echo "release_tag=${OPENCLASH_VER}" >> "$GITHUB_OUTPUT"
        echo "release_name=ZN-M2 OpenClash ${OPENCLASH_VER}" >> "$GITHUB_OUTPUT"

        cat << 'EOF' > release.txt
        ## ZN-M2 (IPQ6000) 硬件定制固件
        - 架构底座：IPQ6000 (OpenWrt 21.02)
        - 硬件优化：全效适配 1GB 大内存与 USB 供电强化版
        - 核心服务：OpenClash + MosDNS 分流解析
        - 校验文件：详细软件包 manifest 及文件 sha256 校验参见附件。
        EOF

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: success()
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        name: ${{ steps.tag.outputs.release_name }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: /tmp/release-firmware/*

    - name: Delete old workflow runs
      if: success()
      uses: ophub/delete-releases-workflows@v0.1.0
      with:
        delete_workflows: true
        workflows_keep_day: 3
        gh_token: ${{ github.token }}
